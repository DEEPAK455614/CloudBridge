name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct corrected source
        shell: bash
        run: |
          mkdir -p work
          cat source/CloudBridge.zip.b64.part* > /tmp/cloudbridge.b64
          base64 -d /tmp/cloudbridge.b64 > /tmp/CloudBridge.zip
          unzip -q /tmp/CloudBridge.zip -d work

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Unit tests
        working-directory: work
        run: gradle testDebugUnitTest --stacktrace

      - name: Lint
        working-directory: work
        run: gradle lintDebug --stacktrace

      - name: Build debug APK
        working-directory: work
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CloudBridge-debug-apk
          path: work/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
