name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download corrected source archive
        shell: bash
        run: |
          mkdir -p work
          curl -L --fail --retry 3 \
            "https://drive.google.com/uc?export=download&id=1p6rt4Nni_A8Vdaxsw_VceyDW-qMKesfs" \
            -o /tmp/CloudBridge.zip
          unzip -q /tmp/CloudBridge.zip -d work

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Unit tests
        working-directory: work
        run: gradle testDebugUnitTest --stacktrace

      - name: Lint
        working-directory: work
        run: gradle lintDebug --stacktrace

      - name: Build debug APK
        working-directory: work
        run: gradle assembleDebug --stacktrace

      - name: Print signing report
        working-directory: work
        run: gradle signingReport --console=plain

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CloudBridge-debug-apk
          path: work/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
